<div class="min-h-screen grid place-items-center px-4">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Merkatto</h1>
      <p class="mt-1 text-sm text-slate-500">Gestión operativa de tu negocio</p>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
    >
      <label class="block text-sm font-medium text-slate-700">Correo</label>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900"
        placeholder="admin@martita.pe"
      />

      <label class="mt-4 block text-sm font-medium text-slate-700">Contraseña</label>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900"
        placeholder="••••••••"
      />

      @if (error()) {
        <p class="mt-3 text-sm text-red-600">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="mt-6 w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-slate-800 disabled:opacity-50"
      >
        {{ loading() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
