<div class="min-h-screen grid place-items-center px-4">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Cambiá tu contraseña</h1>
      <p class="mt-1 text-sm text-slate-500">
        Por seguridad, definí una contraseña nueva antes de entrar.
      </p>
    </div>

    <form (ngSubmit)="submit()" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      @if (email) {
        <p class="mb-4 rounded-lg bg-slate-50 px-3 py-2 text-xs text-slate-500">
          Cuenta: <span class="font-medium text-slate-700">{{ email }}</span>
        </p>
      }

      <label class="block text-sm font-medium text-slate-700">Contraseña actual</label>
      <input
        type="password"
        name="currentPassword"
        [(ngModel)]="currentPassword"
        autocomplete="current-password"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900"
        placeholder="••••••••"
      />

      <label class="mt-4 block text-sm font-medium text-slate-700">Nueva contraseña</label>
      <input
        type="password"
        name="newPassword"
        [(ngModel)]="newPassword"
        autocomplete="new-password"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900"
        placeholder="Mínimo 8 caracteres"
      />

      <label class="mt-4 block text-sm font-medium text-slate-700">Repetí la nueva contraseña</label>
      <input
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        autocomplete="new-password"
        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900"
        placeholder="••••••••"
      />

      @if (error()) {
        <p class="mt-3 text-sm text-red-600">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="saving()"
        class="mt-6 w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-slate-800 disabled:opacity-50"
      >
        {{ saving() ? 'Guardando…' : 'Guardar y continuar' }}
      </button>

      <button
        type="button"
        (click)="logout()"
        class="mt-2 w-full rounded-lg px-4 py-2 text-sm text-slate-500 hover:bg-slate-100"
      >
        Cerrar sesión
      </button>
    </form>
  </div>
</div>
