<div class="mx-auto max-w-2xl">
  <a routerLink="/productos" class="text-sm text-slate-500 hover:text-slate-900">← Productos</a>
  <h1 class="mt-2 text-xl font-semibold text-slate-900">
    {{ id() ? 'Editar producto' : 'Nuevo producto' }}
  </h1>

  <form [formGroup]="form" (ngSubmit)="save()" class="mt-6 space-y-6">
    <!-- Datos generales -->
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700">Datos generales</h2>
      <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <label class="block">
          <span class="text-sm text-slate-600">Nombre</span>
          <input formControlName="name" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900" />
        </label>
        <label class="block">
          <span class="text-sm text-slate-600">Código interno (opcional)</span>
          <input formControlName="internalCode" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900" />
        </label>
        <label class="block">
          <span class="text-sm text-slate-600">Categoría</span>
          <select formControlName="categoryId" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900">
            <option [ngValue]="null" disabled>Selecciona…</option>
            @for (c of categories(); track c.id) { <option [ngValue]="c.id">{{ c.name }}</option> }
          </select>
        </label>
        <label class="block">
          <span class="text-sm text-slate-600">Marca (opcional)</span>
          <select formControlName="brandId" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900">
            <option [ngValue]="null">—</option>
            @for (b of brands(); track b.id) { <option [ngValue]="b.id">{{ b.name }}</option> }
          </select>
        </label>
      </div>
    </section>

    <!-- Compra y venta -->
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700">Compra y venta</h2>
      <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-3">
        <label class="block">
          <span class="text-sm text-slate-600">Unidad de compra</span>
          <input formControlName="purchaseUnit" placeholder="paquete" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900" />
        </label>
        <label class="block">
          <span class="text-sm text-slate-600">Costo por unidad de compra (S/)</span>
          <input type="number" step="0.01" formControlName="lastPurchaseCost" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900" />
        </label>
        <label class="block">
          <span class="text-sm text-slate-600">Unidades por compra</span>
          <input type="number" step="1" formControlName="unitsPerPurchaseUnit" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900" />
        </label>
        <label class="block">
          <span class="text-sm text-slate-600">Unidad de venta</span>
          <input formControlName="saleUnit" placeholder="unidad" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900" />
        </label>
        <label class="block">
          <span class="text-sm text-slate-600">Precio de venta (S/)</span>
          <input type="number" step="0.01" formControlName="salePrice" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900" />
        </label>
      </div>

      <!-- Live preview -->
      <div class="mt-4 flex gap-6 rounded-xl bg-slate-50 px-4 py-3 text-sm">
        <div>
          <span class="text-slate-500">Costo unitario</span>
          <div class="font-semibold text-slate-900">S/ {{ unitCost() | number: '1.2-2' }}</div>
        </div>
        <div>
          <span class="text-slate-500">Utilidad por unidad</span>
          <div class="font-semibold" [class.text-emerald-600]="margin() >= 0" [class.text-red-600]="margin() < 0">
            S/ {{ margin() | number: '1.2-2' }}
          </div>
        </div>
      </div>
    </section>

    <!-- Inventario -->
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700">Inventario</h2>
      <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <label class="block">
          <span class="text-sm text-slate-600">Stock mínimo (alerta)</span>
          <input type="number" step="1" formControlName="minStock" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900" />
        </label>
        @if (!id()) {
          <label class="block">
            <span class="text-sm text-slate-600">Stock inicial en almacén</span>
            <input type="number" step="1" formControlName="initialWarehouseStock" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-900" />
          </label>
        }
      </div>
    </section>

    @if (error()) { <p class="text-sm text-red-600">{{ error() }}</p> }

    <div class="flex justify-end gap-3">
      <a routerLink="/productos" class="rounded-lg px-4 py-2 text-sm text-slate-600 hover:bg-slate-100">Cancelar</a>
      <button type="submit" [disabled]="saving()" class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800 disabled:opacity-50">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
