<div class="flex min-h-screen">
  <!-- Sidebar (desktop-first) -->
  <aside class="hidden w-60 shrink-0 border-r border-slate-200 bg-white md:flex md:flex-col">
    <div class="px-5 py-5">
      <span class="text-lg font-semibold tracking-tight text-slate-900">Merkatto</span>
    </div>
    <nav class="flex-1 space-y-1 px-3">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-slate-100 text-slate-900"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-slate-50"
        >
          <span class="text-slate-400">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="border-t border-slate-200 p-3">
      <div class="px-2 py-1 text-xs text-slate-500">{{ user()?.fullName }}</div>
      <button
        (click)="logout()"
        class="mt-1 w-full rounded-lg px-3 py-2 text-left text-sm text-slate-600 hover:bg-slate-50"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex flex-1 flex-col">
    <header class="flex h-14 items-center justify-between border-b border-slate-200 bg-white px-6">
      <span class="text-sm font-medium text-slate-700">Bodega Martita</span>
      <span class="text-xs text-slate-400">{{ user()?.email }}</span>
    </header>
    <main class="flex-1 p-6">
      <router-outlet />
    </main>
  </div>
</div>
